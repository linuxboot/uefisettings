[package]
name = "uefisettings-qemu-guest"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false
description = "Tests of uefisettings that run inside the QEMU test guests (tests/qemu/run.sh)"

[dependencies]
# The CRC-32 of an extracted HII database, for extract_db_matches.
crc32fast = "1.4"
# FS_IOC_GETFLAGS and FS_IOC_SETFLAGS without unsafe code, for clear_immutable.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10.9"

# The tests run only in the QEMU test guests, so they build only with this feature, which
# tests/qemu/run.sh enables, and `cargo test --workspace` elsewhere builds no test binary
# of this crate. Each file in tests/ needs a [[test]] entry that requires the feature.
[features]
test-vm = []

# The library has no unit tests.
[lib]
test = false

[[test]]
name = "boot_smoke"
required-features = ["test-vm"]

[[test]]
name = "efivarfs_crash_guard"
required-features = ["test-vm"]

[[test]]
name = "global_variables"
required-features = ["test-vm"]

[[test]]
name = "hii"
required-features = ["test-vm"]

[[test]]
name = "hii_acpi"
required-features = ["test-vm"]

