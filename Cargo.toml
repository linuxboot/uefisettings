[package]
name = "uefisettings"
description = "The tool to read/get/extract and write/change/modify BIOS/UEFI settings from a Linux terminal or the UEFI Shell."
version = "0.1.6"
edition = "2021"
license = "BSD-3-Clause"
homepage = "https://github.com/linuxboot/uefisettings"
exclude = ["/Makefile", "/scripts/", "/tests/qemu/"]

[lib]
name = "uefisettings"
path = "src/lib/lib.rs"

[dependencies]
uefisettings_backend_thrift = { path = "thrift/rust/uefisettings_backend_thrift", version = "0.1.6" }
uefisettings_spellings_db_thrift = { path = "thrift/rust/uefisettings_spellings_db_thrift", version = "0.1.6" }
anyhow = "1.0"
fbthrift = { package = "fbthrift-git", version = "0.0.8" }
clap = { version = "4.5.28", features = ["derive", "env", "unicode", "wrap_help"] }
log = { version = "0.4", features = ["kv_unstable", "kv_unstable_std"] }
serde = { version = "1.0", features = ["derive", "rc"]}
serde_json = { version = "1.0", features = ["float_roundtrip", "unbounded_depth"] }
# binrw's default verbose-backtrace feature puts ANSI bold codes and a banner into its
# errors, which main prints as JSON (https://github.com/linuxboot/uefisettings/issues/16).
binrw = { version = "0.13", default-features = false, features = ["std"] }
thiserror = "1.0"
bitflags = "2.4.1"
# Secrets (src/lib/secret_file.rs) compare in constant time and zeroize on drop; 1.9.1, as
# 1.9.0's Zeroizing prints its bytes in Debug.
subtle = "2.6"
zeroize = "1.9.1"
# GUIDs in registry format, such as the variable commands take; the uefi crate's Guid is uguid's.
uguid = "2.2.1"
# The SHA-256 of each signature in the EFI_SIGNATURE_LISTs that variable get summarizes, and
# the digest of signed variable writes.
sha2 = { version = "0.10.9", features = ["oid"] }
# Signed authenticated variable writes (UEFI 2.11 §8.2.6), one feature set for every target:
# rsa's std feature pulls getrandom through rand_core, which builds for no UEFI target, and cms
# without its builder, which always adds the signed attributes that §8.2.6 forbids.
rsa = { version = "0.9", default-features = false, features = ["sha2", "pem"] }
cms = { version = "0.2", default-features = false }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
der = { version = "0.7", features = ["alloc", "pem", "std"] }
rand_core = { version = "0.6", default-features = false }
# The RNG of RSA blinding on every target, seeded once from the platform's source.
rand_chacha = { version = "0.3", default-features = false }

# The Linux and Windows builds find the ESP on a disk, whose GPT they check by its CRC32s.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
crc32fast = "1.4"

# Only the Linux build uses these: efivarfs, the HiiDB in sysfs, iLO through
# ilorest_chif.so, and the CLI's logging.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["fs", "ioctl", "mount"] }
libloading = "0.8"
httparse = "1.8"
rand = { version = "0.8", features = ["small_rng"] }
proc-mounts = "0.3"
env_logger = "0.10"

# The macOS build opens the efivar files of a dump without following symlinks.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The UEFI Shell build reaches the firmware through boot services: the HII database protocol,
# GetVariable() and SetVariable().
[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.41", features = ["alloc"] }
# EFI_SHELL_PARAMETERS_PROTOCOL.StdIn and EFI_SHELL_PROTOCOL's GetFileInfo and ReadFile, for the
# secret that `-` names, which uefi does not wrap.
uefi-raw = "0.17"

# The seed of RSA blinding outside the UEFI Shell: getrandom, which has no UEFI backend.
[target.'cfg(not(target_os = "uefi"))'.dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

# The Windows build reaches the firmware through Win32: Get/SetFirmwareEnvironmentVariableExW
# for variables, and the HiiDB driver (src/lib/hii/hiidb_driver.rs) for the HiiDB.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
# fs: tests make FIFOs, also on macOS, whose build has no nix otherwise; inotify: a test sees
# which files open_efivar opens; term: a test opens a pseudo-terminal
nix = { version = "0.27", features = ["fs", "inotify", "term"] }
tempfile = "3.5"
# The Win32 error codes and IOCTL constants of the Windows backends, whose logic the tests of
# every host run
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Ioctl"] }

# thrift/ is a package of its own; its generated crates build as dependencies that clippy
# does not lint, and the Makefile's RUSTFLAGS fails the checks on their compiler warnings.
[workspace]
members = ["tests/qemu/guest", "tests/qemu/publish-hiidb"]
exclude = ["thrift"]
