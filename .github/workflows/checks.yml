# The checks of the Makefile; the QEMU boots, which need KVM and apt packages, in
# a job of their own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs: a new push cancels the previous run. main: one group per run, as a shared
# group drops pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gcc's 32-bit libraries, which test-i686 links with.
      - run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib

      - run: make setup

      # After setup: the key covers installed toolchains.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every check but the boots.
      - run: make -k lint test test-i686

  test-e2e-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          sudo apt-get update
          xargs --arg-file=tests/qemu/ubuntu-packages sudo apt-get install --yes

      # Opens /dev/kvm to the runner user, per
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No rust-cache: its cleanup takes run.sh's initramfs/tests for a cargo
      # profile and logs errors; the builds take about a minute without it.
      - run: make setup

      # Kernel RPMs and DriverSample.efi. Saved only on success, as run.sh reuses
      # DriverSample.efi unchecked.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/qemu-test/kernel-rpms
            target/qemu-test/driver-sample
          key: qemu-inputs-${{ hashFiles('tests/qemu/kernel.sha256', 'tests/qemu/build-driver-sample.sh') }}

      - run: make test-e2e-qemu

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-test-logs
          path: |
            target/qemu-test/*/*/*.log
            target/qemu-test/*/executables
          if-no-files-found: ignore
          retention-days: 14
