# The checks of the Makefile; the QEMU boots, which need KVM and apt packages, and
# the unit tests on macOS and Windows in jobs of their own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs: a new push cancels the previous run. main: one group per run, as a shared
# group drops pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # The image of test-e2e-qemu too: one image, one migration.
  lint-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gcc's 32-bit libraries, which test-i686 links with.
      - run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib

      - run: make setup

      # After setup: the key covers installed toolchains.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every check but the boots.
      - run: make -k lint test test-i686

  # The unit tests of the macOS build on both of its targets; lint-and-test lints them.
  test-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GNU make 4 as gmake: Apple's make 3.81 ignores the Makefile's .SHELLFLAGS (3.82).
      - run: brew install make

      - run: gmake setup

      # After setup: the key covers installed toolchains.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: gmake -k test

  # The unit tests of the Windows build on x86_64, whose firmware calls run against
  # fakes; lint-and-test lints both of its targets.
  test-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    # Git for Windows' bash, which the Makefile's recipes and scripts need.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GNU make, which the image lacks.
      - run: choco install make --yes --no-progress

      - run: make setup

      # After setup: the key covers installed toolchains.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: make -k test

  # QEMU 9.0 and newer fault unaligned loads from Device memory as arm64 does, which the
  # aarch64 guests check; Ubuntu 24.04 has QEMU 8.2.
  test-e2e-qemu:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          sudo apt-get update
          xargs --arg-file=tests/qemu/ubuntu-packages sudo apt-get install --yes

      # Opens /dev/kvm to the runner user, per
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No rust-cache: its cleanup takes run.sh's initramfs/tests for a cargo
      # profile and logs errors; the builds take about a minute without it.
      - run: make setup

      # The guests' packages, each architecture's DriverSample.efi and Secure Boot firmware,
      # keyed also on the apt packages, the pinned iasl and the runner image (this file) that
      # build them. Saved only on success, as run.sh reuses DriverSample.efi and the firmware
      # unchecked.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/qemu-test/packages
            target/qemu-test/*/driver-sample
            target/qemu-test/*/secboot-firmware
          key: qemu-inputs-${{ hashFiles('tests/qemu/guest-packages-*', 'tests/qemu/build-driver-sample.sh', 'tests/qemu/build-secboot-firmware.sh', 'tests/qemu/host-packages', 'tests/qemu/ubuntu-packages', '.github/workflows/checks.yml') }}

      - run: make -k test-e2e-qemu

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-test-logs
          path: |
            target/qemu-test/*/*/*/*.log
            target/qemu-test/*/*/executables
          if-no-files-found: ignore
          retention-days: 14
