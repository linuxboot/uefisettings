# The checks of the Makefile; the QEMU boots, which need KVM and apt packages, in
# a job of their own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs: a new push cancels the previous run. main: one group per run, as a shared
# group drops pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # The image of test-e2e-qemu too: one image, one migration.
  lint-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gcc's 32-bit libraries, which test-i686 links with.
      - run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib

      - run: make setup

      # After setup: the key covers installed toolchains.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every check but the boots.
      - run: make -k lint test test-i686

  # QEMU 9.0 and newer fault unaligned loads from Device memory as arm64 does, which the
  # aarch64 guests check; Ubuntu 24.04 has QEMU 8.2.
  test-e2e-qemu:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          sudo apt-get update
          xargs --arg-file=tests/qemu/ubuntu-packages sudo apt-get install --yes

      # Opens /dev/kvm to the runner user, per
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No rust-cache: its cleanup takes run.sh's initramfs/tests for a cargo
      # profile and logs errors; the builds take about a minute without it.
      - run: make setup

      # The guests' packages and each architecture's DriverSample.efi, keyed also on the
      # apt packages and the runner image (this file) that build DriverSample. Saved only
      # on success, as run.sh reuses DriverSample.efi unchecked.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/qemu-test/packages
            target/qemu-test/*/driver-sample
          key: qemu-inputs-${{ hashFiles('tests/qemu/guest-packages-*', 'tests/qemu/build-driver-sample.sh', 'tests/qemu/ubuntu-packages', '.github/workflows/checks.yml') }}

      - run: make -k test-e2e-qemu-x86_64 test-e2e-qemu-i686

      # DO NOT MERGE: diagnostics for the reset on AMD runners.
      - if: always()
        run: tests/qemu/ci-diag-reset.sh

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reset-diag
          path: |
            target/qemu-test/diag
            target/qemu-test/x86_64/*/*/*.log
            target/qemu-test/i686/*/*/*.log
          if-no-files-found: ignore
          retention-days: 14

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-test-logs
          path: |
            target/qemu-test/*/*/*/*.log
            target/qemu-test/*/*/executables
          if-no-files-found: ignore
          retention-days: 14
