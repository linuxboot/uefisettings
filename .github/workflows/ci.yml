# Continuous integration of uefisettings for pushes to main and pull requests:
# lints, tests, docs and the QEMU tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the checks of the previous one; every
  # other run gets a group of its own, so no push to main is cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Newer releases bring lints that the code does not satisfy yet.
  RUSTUP_TOOLCHAIN: "1.93.1"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to the commit of a release, named in a comment.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --check

  clippy:
    name: clippy (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - *checkout
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target "$TARGET" --no-self-update
      - run: cargo clippy --locked --workspace --all-targets --all-features --target "$TARGET" -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: .github/scripts/assert-tests-ran.sh cargo test --locked

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - *checkout
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo doc --no-deps --document-private-items --locked

  qemu:
    # Boots the scenarios of tests/qemu/scenarios.tsv under KVM; see
    # tests/qemu/README.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      # Opens /dev/kvm to the runner user, as GitHub's changelog of 2024-04-02
      # gives it: https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update
      - run: xargs --arg-file=tests/qemu/ubuntu-packages sudo apt-get install --yes --no-install-recommends
      # The runner image picks the package versions; this logs them.
      - run: xargs --arg-file=tests/qemu/ubuntu-packages dpkg-query --show
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl,x86_64-unknown-uefi --no-self-update
      - run: cargo fmt --check --manifest-path tests/qemu/guest/Cargo.toml
      - run: cargo doc --no-deps --document-private-items --locked --manifest-path tests/qemu/guest/Cargo.toml
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo fmt --check --manifest-path tests/qemu/publish-hiidb/Cargo.toml
      - run: cargo clippy --locked --release --target x86_64-unknown-uefi --manifest-path tests/qemu/publish-hiidb/Cargo.toml -- -D warnings
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/qemu-test/kernel-rpms
          key: qemu-kernel-${{ hashFiles('tests/qemu/kernel.sha256') }}
      # The script pins the EDK2 commit, so its hash identifies the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/qemu-test/driver-sample
          key: driver-sample-${{ hashFiles('tests/qemu/build-driver-sample.sh') }}
      - run: tests/qemu/run.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-test-logs
          path: target/qemu-test/*/*/*.log
