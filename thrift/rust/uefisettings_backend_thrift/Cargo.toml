[package]
name = "uefisettings_backend_thrift"
description = "Backend interface definition DB for the tool to read/get/extract and write/change/modify BIOS/UEFI settings from Linux terminal."
version = "0.1.6"
edition = "2021"
license = "BSD-3-Clause"
homepage = "https://github.com/linuxboot/uefisettings"

[dependencies]
anyhow = "1.0"
fbthrift = "0.0"

[lib]
name = "uefisettings_backend_thrift"
path = "uefisettings_backend.rs"

# uefisettings_backend.thrift declares no exception, so the generated errors module is
# empty, and rustc reports its glob re-export, `pub use self::errors::*`, as an unused
# import. The allow sits here because regenerating the crate replaces only the .rs file.
[lints.rust]
unused_imports = "allow"
