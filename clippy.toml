# HashMap and HashSet hash with RandomState, whose keys std on UEFI takes from
# EFI_RNG_PROTOCOL, else from rdrand on x86 only, else it panics (Rust 1.93.1
# library/std/src/sys/random/uefi.rs fill_bytes): an aarch64 UEFI Shell without
# an RNG would panic at the first HashMap. BTreeMap and BTreeSet need no keys.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "RandomState can panic on UEFI", replacement = "std::collections::BTreeMap" },
    { path = "std::collections::HashSet", reason = "RandomState can panic on UEFI", replacement = "std::collections::BTreeSet" },
]

# The UEFI Shell build's main must return. Its entry point turns ExitCode::FAILURE into
# EFI_ABORTED, where std::process::exit would exit the image with its code as the status, a
# warning such as 1. uefi::boot::exit would also skip std's cleanup, which closes the
# ExitBootServices event whose notify function lives in the image (Rust 1.93.1
# library/std/src/sys/pal/uefi/mod.rs init, cleanup). The Linux build has no uefi crate, hence
# allow-invalid.
disallowed-methods = [
    { path = "std::process::exit", reason = "main returns its ExitCode, which the UEFI Shell build's entry point turns into EFI_ABORTED" },
    { path = "uefi::boot::exit", reason = "exits the image before std closes its ExitBootServices event, whose notify function then runs in freed memory", allow-invalid = true },
    # read_physical_memory_at reads any range of /dev/mem. The efivar source
    # reads only through RuntimeMemory or ReservedMemory, which check each range against a
    # firmware memory map first: their DevMem is the only caller besides the configuration table
    # source. Only the Linux build has hii::extract, hence allow-invalid.
    { path = "uefisettings::hii::extract::read_physical_memory_at", reason = "reads /dev/mem without RuntimeMemory's or ReservedMemory's check against a firmware memory map", allow-invalid = true },
]
