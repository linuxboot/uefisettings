# HashMap and HashSet hash with RandomState, whose keys std on UEFI takes from
# EFI_RNG_PROTOCOL, else from rdrand on x86 only, else it panics (Rust 1.93.1
# library/std/src/sys/random/uefi.rs fill_bytes): an aarch64 UEFI Shell without
# an RNG would panic at the first HashMap. BTreeMap and BTreeSet need no keys.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "RandomState can panic on UEFI", replacement = "std::collections::BTreeMap" },
    { path = "std::collections::HashSet", reason = "RandomState can panic on UEFI", replacement = "std::collections::BTreeSet" },
    # rsa's PSS SigningKey signs unblinded even with a random source (rsa 0.9.10
    # src/pss/signing_key.rs: sign_digest(rng, false, ...)), as the disallowed-methods below say.
    { path = "rsa::pss::SigningKey", reason = "unblinded RSA signing", replacement = "rsa::pss::BlindedSigningKey" },
]

# The UEFI Shell build's main must return. Its entry point turns ExitCode::FAILURE into
# EFI_ABORTED, where std::process::exit would exit the image with its code as the status, a
# warning such as 1. uefi::boot::exit would also skip std's cleanup, which closes the
# ExitBootServices event whose notify function lives in the image (Rust 1.93.1
# library/std/src/sys/pal/uefi/mod.rs init, cleanup). The Linux build has no uefi crate, hence
# allow-invalid.
disallowed-methods = [
    # binrw::Error's Display prints a backtrace frame per field being parsed, with the Rust
    # source location of its derive, on lines of their own (binrw 0.13.3
    # src/error/backtrace.rs); ParseError shows it on one line.
    { path = "binrw::BinReaderExt::read_ne", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_le", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_be", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_type", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_ne_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_le_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_be_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinReaderExt::read_type_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    # BinRead's own reads fail the same way. Its read_options stays allowed: every
    # #[derive(BinRead)] calls it.
    { path = "binrw::BinRead::read", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_be", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_le", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_ne", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_be_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_le_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "binrw::BinRead::read_ne_args", reason = "fails with binrw::Error, whose Display prints multi-line backtrace frames", replacement = "crate::parse_error::ReadParsed" },
    { path = "std::process::exit", reason = "main returns its ExitCode, which the UEFI Shell build's entry point turns into EFI_ABORTED" },
    { path = "uefi::boot::exit", reason = "exits the image before std closes its ExitBootServices event, whose notify function then runs in freed memory", allow-invalid = true },
    # read_physical_memory_at reads any range of /dev/mem. The efivar source
    # reads only through RuntimeMemory or ReservedMemory, which check each range against a
    # firmware memory map first: their DevMem is the only caller. Only the Linux build has
    # hii::extract, hence allow-invalid.
    { path = "uefisettings::hii::extract::read_physical_memory_at", reason = "reads /dev/mem without RuntimeMemory's or ReservedMemory's check against a firmware memory map", allow-invalid = true },
    # rsa has no release that fixes RUSTSEC-2023-0071's timing leak; blinding is partial
    # hardening, and uefisettings runs as the advisory's workaround allows: local use on a
    # non-compromised computer. rsa's SigningKey runs these unblinded, with no random source
    # (rsa 0.9.10 src/pkcs1v15/signing_key.rs: sign::<DummyRng>(None, ...)), and signature's
    # blanket SignerMut forwards to Signer::try_sign.
    { path = "signature::Signer::try_sign", reason = "unblinded RSA signing", replacement = "signature::RandomizedSigner::try_sign_with_rng" },
    { path = "signature::Signer::sign", reason = "unblinded RSA signing", replacement = "signature::RandomizedSigner::try_sign_with_rng" },
    { path = "signature::SignerMut::try_sign", reason = "unblinded RSA signing", replacement = "signature::RandomizedSigner::try_sign_with_rng" },
    { path = "signature::SignerMut::sign", reason = "unblinded RSA signing", replacement = "signature::RandomizedSigner::try_sign_with_rng" },
    { path = "signature::DigestSigner::try_sign_digest", reason = "unblinded RSA signing", replacement = "signature::RandomizedDigestSigner::try_sign_digest_with_rng" },
    { path = "signature::DigestSigner::sign_digest", reason = "unblinded RSA signing", replacement = "signature::RandomizedDigestSigner::try_sign_digest_with_rng" },
    { path = "signature::hazmat::PrehashSigner::sign_prehash", reason = "unblinded RSA signing", replacement = "signature::hazmat::RandomizedPrehashSigner::sign_prehash_with_rng" },
    { path = "rsa::RsaPrivateKey::sign", reason = "unblinded RSA signing", replacement = "rsa::RsaPrivateKey::sign_with_rng" },
    { path = "rsa::traits::SignatureScheme::sign", reason = "blinds only with Some(rng)", replacement = "signature::RandomizedSigner::try_sign_with_rng" },
    # Pss::new and new_with_salt make a PSS padding that signs unblinded even with a random
    # source (rsa 0.9.10 src/pss.rs: blinded: false); a Pss literal sets blinded itself.
    { path = "rsa::pss::Pss::new", reason = "unblinded RSA signing", replacement = "rsa::pss::Pss::new_blinded" },
    { path = "rsa::pss::Pss::new_with_salt", reason = "unblinded RSA signing", replacement = "rsa::pss::Pss::new_blinded_with_salt" },
]
